<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="galleryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e20"/>
      <stop offset="50%" stop-color="#062e2c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="galleryAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="galleryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#galleryBg)"/>
  
  <!-- Subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#galleryAccent)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Filter tabs bar indicator at top of gallery -->
  <g transform="translate(100, 105)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="url(#galleryAccent)" opacity="0.9"/>
    <rect x="95" y="0" width="65" height="24" rx="12" fill="#1e293b" opacity="0.8"/>
    <rect x="175" y="0" width="75" height="24" rx="12" fill="#1e293b" opacity="0.8"/>
    <rect x="265" y="0" width="55" height="24" rx="12" fill="#1e293b" opacity="0.8"/>
  </g>

  <!-- Gallery Grid Items -->
  <g transform="translate(100, 155)">
    <!-- Card 1: Large Featured Item -->
    <rect x="0" y="0" width="145" height="145" rx="20" fill="url(#cardGrad1)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))"/>
    <circle cx="45" cy="45" r="16" fill="rgba(255,255,255,0.4)"/>
    <path d="M15 125 L65 75 L115 125 Z" fill="rgba(255,255,255,0.35)"/>
    <path d="M75 125 L105 95 L135 125 Z" fill="rgba(255,255,255,0.25)"/>

    <!-- Card 2: Right top item -->
    <rect x="165" y="0" width="155" height="105" rx="20" fill="url(#cardGrad2)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))"/>
    <circle cx="210" cy="38" r="12" fill="rgba(255,255,255,0.4)"/>
    <path d="M180 90 L220 55 L260 90 Z" fill="rgba(255,255,255,0.3)"/>

    <!-- Card 3: Left bottom item -->
    <rect x="0" y="165" width="145" height="105" rx="20" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <circle cx="40" cy="195" r="10" fill="rgba(255,255,255,0.2)"/>
    <path d="M20 250 L60 215 L100 250 Z" fill="rgba(255,255,255,0.15)"/>

    <!-- Card 4: Right bottom item (Indigo/Purple) -->
    <rect x="165" y="125" width="155" height="145" rx="20" fill="url(#cardGrad3)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))"/>
    <circle cx="210" cy="165" r="14" fill="rgba(255,255,255,0.4)"/>
    <path d="M185 245 L235 195 L285 245 Z" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- Elite Crown / Sparkle badge at bottom right -->
  <g transform="translate(370, 370)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="url(#galleryAccent)" stroke-width="3" filter="url(#galleryGlow)"/>
    <!-- Diamond / Star icon -->
    <path d="M0 -20 L6 -6 L20 0 L6 6 L0 20 L-6 6 L-20 0 L-6 -6 Z" fill="url(#galleryAccent)"/>
  </g>
</svg>
