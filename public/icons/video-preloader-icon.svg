<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Rotating preloader ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Glowing active preloader arc -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="750 350" filter="url(#glow)"/>

  <!-- Center video frame circle/card -->
  <circle cx="256" cy="256" r="120" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Glowing background behind play button -->
  <circle cx="256" cy="256" r="80" fill="url(#accentGrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Play button icon -->
  <polygon points="230,195 320,256 230,317" fill="url(#playGrad)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>

  <!-- Small sparkling accent dots representing buffering/animation -->
  <circle cx="120" cy="170" r="8" fill="#6366f1" opacity="0.8"/>
  <circle cx="390" cy="180" r="10" fill="#ec4899" opacity="0.8"/>
  <circle cx="370" cy="350" r="7" fill="#a855f7" opacity="0.7"/>
</svg>
